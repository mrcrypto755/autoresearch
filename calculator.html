<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a1a;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    .calculator {
      width: 320px;
      background: #202020;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      user-select: none;
    }

    /* ---- title bar ---- */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 4px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 600;
    }
    .titlebar-icons { display: flex; gap: 6px; }
    .titlebar-icons span {
      width: 12px; height: 12px; border-radius: 50%;
      background: #444;
    }

    /* ---- display ---- */
    .display {
      padding: 4px 16px 12px;
      text-align: right;
    }
    .history {
      min-height: 22px;
      font-size: 13px;
      color: #888;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .current {
      font-size: 48px;
      font-weight: 300;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      line-height: 1.1;
      transition: font-size 0.1s;
    }
    .current.small  { font-size: 32px; }
    .current.xsmall { font-size: 22px; }

    /* ---- buttons ---- */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2px;
      padding: 0 2px 2px;
    }

    button {
      border: none;
      outline: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 16px;
      height: 64px;
      border-radius: 6px;
      transition: background 0.08s, transform 0.06s;
    }
    button:active { transform: scale(0.95); }

    .btn-num  { background: #333; color: #fff; }
    .btn-func { background: #2d2d2d; color: #fff; font-size: 14px; }
    .btn-op   { background: #3b3b3b; color: #fff; font-size: 20px; }
    .btn-eq   { background: #0078d4; color: #fff; font-size: 20px; }

    .btn-num:hover  { background: #404040; }
    .btn-func:hover { background: #3a3a3a; }
    .btn-op:hover   { background: #4a4a4a; }
    .btn-eq:hover   { background: #1a8fe8; }

    /* keyboard shortcut hint overlay on focus */
    button:focus-visible { outline: 2px solid #0078d4; outline-offset: -2px; }
  </style>
</head>
<body>
<div class="calculator">
  <div class="titlebar">
    <span>Calculator</span>
    <div class="titlebar-icons">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div class="display">
    <div class="history" id="history"></div>
    <div class="current" id="current">0</div>
  </div>

  <div class="buttons">
    <!-- row 1 -->
    <button class="btn-func" data-action="percent">%</button>
    <button class="btn-func" data-action="ce">CE</button>
    <button class="btn-func" data-action="clear">C</button>
    <button class="btn-func" data-action="backspace">⌫</button>
    <!-- row 2 -->
    <button class="btn-func" data-action="reciprocal">¹/x</button>
    <button class="btn-func" data-action="square">x²</button>
    <button class="btn-func" data-action="sqrt">²√x</button>
    <button class="btn-op"   data-action="op" data-op="/">÷</button>
    <!-- row 3 -->
    <button class="btn-num"  data-action="digit" data-digit="7">7</button>
    <button class="btn-num"  data-action="digit" data-digit="8">8</button>
    <button class="btn-num"  data-action="digit" data-digit="9">9</button>
    <button class="btn-op"   data-action="op" data-op="*">×</button>
    <!-- row 4 -->
    <button class="btn-num"  data-action="digit" data-digit="4">4</button>
    <button class="btn-num"  data-action="digit" data-digit="5">5</button>
    <button class="btn-num"  data-action="digit" data-digit="6">6</button>
    <button class="btn-op"   data-action="op" data-op="-">−</button>
    <!-- row 5 -->
    <button class="btn-num"  data-action="digit" data-digit="1">1</button>
    <button class="btn-num"  data-action="digit" data-digit="2">2</button>
    <button class="btn-num"  data-action="digit" data-digit="3">3</button>
    <button class="btn-op"   data-action="op" data-op="+">+</button>
    <!-- row 6 -->
    <button class="btn-func" data-action="negate">+/−</button>
    <button class="btn-num"  data-action="digit" data-digit="0">0</button>
    <button class="btn-num"  data-action="dot">.</button>
    <button class="btn-eq"   data-action="equals">=</button>
  </div>
</div>

<script>
  const displayEl = document.getElementById("current");
  const historyEl = document.getElementById("history");

  let state = {
    display: "0",      // what's shown
    operand: null,     // stored first operand
    operator: null,    // pending operator
    justEval: false,   // last action was equals
    newInput: true,    // next digit replaces display
  };

  function setDisplay(val) {
    const s = String(val);
    state.display = s;
    displayEl.textContent = s;
    // shrink font for long numbers
    displayEl.classList.remove("small", "xsmall");
    if (s.length > 12) displayEl.classList.add("xsmall");
    else if (s.length > 9) displayEl.classList.add("small");
  }

  function formatNum(n) {
    if (!isFinite(n)) return n > 0 ? "Infinity" : "-Infinity";
    // Remove floating-point noise
    let s = parseFloat(n.toPrecision(12)).toString();
    return s;
  }

  function digit(d) {
    if (state.newInput) {
      setDisplay(d === "0" ? "0" : d);
      state.newInput = false;
    } else {
      if (state.display.replace("-", "").length >= 16) return;
      setDisplay(state.display === "0" ? d : state.display + d);
    }
    state.justEval = false;
  }

  function dot() {
    if (state.newInput) { setDisplay("0."); state.newInput = false; return; }
    if (!state.display.includes(".")) setDisplay(state.display + ".");
    state.justEval = false;
  }

  function op(o) {
    const opLabel = { "+": "+", "-": "−", "*": "×", "/": "÷" }[o];
    const cur = parseFloat(state.display);

    if (state.operator && !state.newInput) {
      // chain: evaluate pending
      const result = compute(state.operand, state.operator, cur);
      setDisplay(formatNum(result));
      state.operand = result;
    } else {
      state.operand = cur;
    }

    state.operator = o;
    state.newInput = true;
    state.justEval = false;
    historyEl.textContent = formatNum(state.operand) + " " + opLabel;
  }

  function compute(a, o, b) {
    switch (o) {
      case "+": return a + b;
      case "-": return a - b;
      case "*": return a * b;
      case "/":
        if (b === 0) return "Cannot divide by zero";
        return a / b;
    }
  }

  function equals() {
    if (state.operator === null) { historyEl.textContent = state.display + " ="; return; }
    const opLabel = { "+": "+", "-": "−", "*": "×", "/": "÷" }[state.operator];
    const b = parseFloat(state.display);
    const result = compute(state.operand, state.operator, b);
    historyEl.textContent = formatNum(state.operand) + " " + opLabel + " " + formatNum(b) + " =";
    if (typeof result === "string") {
      displayEl.textContent = result;
      state.display = "0";
    } else {
      setDisplay(formatNum(result));
    }
    state.operator = null;
    state.operand = null;
    state.newInput = true;
    state.justEval = true;
  }

  function clear() {
    state = { display: "0", operand: null, operator: null, justEval: false, newInput: true };
    setDisplay("0");
    historyEl.textContent = "";
  }

  function clearEntry() {
    setDisplay("0");
    state.newInput = true;
  }

  function backspace() {
    if (state.newInput || state.justEval) { setDisplay("0"); state.newInput = true; return; }
    const s = state.display;
    const next = s.length > 1 ? s.slice(0, -1).replace(/[-]$/, "0") : "0";
    setDisplay(next || "0");
    if (next === "0") state.newInput = true;
  }

  function negate() {
    const v = parseFloat(state.display) * -1;
    setDisplay(formatNum(v));
    state.newInput = false;
  }

  function percent() {
    if (state.operand !== null) {
      const v = state.operand * parseFloat(state.display) / 100;
      setDisplay(formatNum(v));
    } else {
      setDisplay(formatNum(parseFloat(state.display) / 100));
    }
    state.newInput = false;
  }

  function reciprocal() {
    const v = parseFloat(state.display);
    if (v === 0) { displayEl.textContent = "Cannot divide by zero"; state.newInput = true; return; }
    historyEl.textContent = "1/(" + formatNum(v) + ")";
    setDisplay(formatNum(1 / v));
    state.newInput = true;
  }

  function square() {
    const v = parseFloat(state.display);
    historyEl.textContent = "sqr(" + formatNum(v) + ")";
    setDisplay(formatNum(v * v));
    state.newInput = true;
  }

  function sqrt() {
    const v = parseFloat(state.display);
    if (v < 0) { displayEl.textContent = "Invalid input"; state.newInput = true; return; }
    historyEl.textContent = "√(" + formatNum(v) + ")";
    setDisplay(formatNum(Math.sqrt(v)));
    state.newInput = true;
  }

  // ---- event wiring ----
  document.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const a = btn.dataset.action;
      if (a === "digit")     digit(btn.dataset.digit);
      else if (a === "dot")       dot();
      else if (a === "op")        op(btn.dataset.op);
      else if (a === "equals")    equals();
      else if (a === "clear")     clear();
      else if (a === "ce")        clearEntry();
      else if (a === "backspace") backspace();
      else if (a === "negate")    negate();
      else if (a === "percent")   percent();
      else if (a === "reciprocal") reciprocal();
      else if (a === "square")    square();
      else if (a === "sqrt")      sqrt();
    });
  });

  document.addEventListener("keydown", e => {
    if (e.key >= "0" && e.key <= "9") digit(e.key);
    else if (e.key === ".")  dot();
    else if (e.key === "+")  op("+");
    else if (e.key === "-")  op("-");
    else if (e.key === "*")  op("*");
    else if (e.key === "/")  { e.preventDefault(); op("/"); }
    else if (e.key === "Enter" || e.key === "=") equals();
    else if (e.key === "Backspace") backspace();
    else if (e.key === "Escape") clear();
    else if (e.key === "Delete") clearEntry();
    else if (e.key === "%") percent();
  });
</script>
</body>
</html>
